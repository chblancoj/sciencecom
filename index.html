<style>
/* layout: single reading column, sticky filter bar, numbered sections like the public-legitimacy viewer */
/* layout: navy masthead + hero band as on scienceandsociety.group, then a white reading column with eyebrow-labelled sections */
:root{
  --bg:#ffffff;--card:#ffffff;--soft:#f1f3f8;--ink:#1b2333;--ink2:#4a5468;--ink3:#7a8396;--line:#e3e7ef;--line2:#cdd3df;
  --navy:#1d2940;--navy2:#16203a;--coral:#d4553f;--gold:#e2b04a;--sky:#9cc3f0;
  --nuc:#d4553f;--con:#2f6db5;--per:#a3abb9;--warn:#b4541f;
  --map0:#dde6f3;--map1:#1d2940;--nodata:#eef0f4;--up:#1a7f37;--down:#c62828;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kick{font-size:12px;letter-spacing:.04em;color:var(--ink3);margin:0 0 6px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:600;text-wrap:balance}
.lede{font-size:15.5px;color:var(--ink2);max-width:68ch;margin:0 0 18px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.toc a{font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:5px 11px;background:var(--card)}
.toc a:hover{border-color:var(--ink3)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0 0 18px}
.hero div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.hero div.wide{border:1.5px solid var(--ink)}
.hero em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.hero span{display:block;font-size:26px;font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.hero small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.4;margin-top:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fld{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)}
select{max-width:190px}
select,button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:5px 8px}
button{cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible,th:focus-visible{outline:2px solid var(--nuc);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;padding:5px 11px;background:transparent;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;width:100%}
.chip{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;padding:0 2px;color:var(--ink3);font-size:13px}
.reset{font-size:12.5px;color:var(--ink2);border-style:dashed}
section{scroll-margin-top:110px;margin-top:30px}
h2.sec{font-size:20px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:10px}
h2.sec span{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.intro{color:var(--ink2);font-size:14.5px;margin:0 0 12px;max-width:72ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{position:relative;min-height:260px}
.chart svg text,.map svg text{fill:var(--ink3);font-size:11px;font-family:var(--sans)}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5;max-width:280px;line-height:1.35}
.tip b{font-weight:600}
.geo{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.geo{grid-template-columns:minmax(0,1fr)}.map{max-width:220px;margin:0 auto}}
@media (max-width:720px){.sticky{position:static}}
.map{position:relative}
.map path{stroke:var(--card);stroke-width:.6;cursor:pointer}
.map path.sel{stroke:var(--ink);stroke-width:1.6}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-top:6px}
.scale .bar{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--map0),var(--map1))}
.rk{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 56px;gap:4px 8px;align-items:center;font-size:12.5px}
.rk button{all:unset;cursor:pointer;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk button.on{color:var(--ink);font-weight:600}
.rk .b{height:12px;border-radius:0 4px 4px 0;background:var(--nuc)}
.rk .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.panel h3{font-size:14px;font-weight:600;margin:0 0 8px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 52px;gap:5px 8px;align-items:center;font-size:12.5px}
.hb .l{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{height:12px;background:var(--soft);border-radius:4px;position:relative}
.hb .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--nuc)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--ink3);margin:8px 0 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink3);font-weight:500;cursor:pointer;white-space:nowrap;user-select:none}
th[aria-sort="ascending"]::after{content:" ↑"}th[aria-sort="descending"]::after{content:" ↓"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.p-N{background:color-mix(in srgb,var(--nuc) 16%,transparent);color:var(--nuc)}
.p-C{background:color-mix(in srgb,var(--con) 18%,transparent);color:var(--con)}
.p-P{background:var(--soft);color:var(--ink2)}
.st-on{color:var(--con)}.st-off{color:var(--ink3)}
.claves{display:grid;gap:10px}
.clave{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.clave b{display:block;font-size:15px;margin-bottom:3px}
.clave p{margin:0;color:var(--ink2);font-size:14px;max-width:72ch}
details{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details summary{cursor:pointer;font-weight:600}
details p,details li{font-size:13.5px;color:var(--ink2);max-width:76ch}
.empty{color:var(--ink3);font-size:13px;padding:30px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.rk .b,.hb .t i{transition:width .3s}}


.nav{background:var(--navy);color:#fff}

.band .sub{font-weight:700;color:var(--sky);font-size:16px;margin:0 0 16px}
.band .lede{color:#dbe2ef;font-size:15px;max-width:70ch;margin:0 0 20px}
.who{display:flex;align-items:center;gap:10px;margin:0 0 22px}
.who .av{width:34px;height:34px;border-radius:50%;background:#2b3a58;border:2px solid var(--coral);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.who b{display:block;font-size:13.5px;color:#fff}.who small{display:block;font-size:12px;color:#aab6cc}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;font-size:13.5px;font-weight:600;border-radius:6px;padding:10px 16px;text-decoration:none}
.btn.p{background:var(--coral);color:#fff;border:1px solid var(--coral)}
.btn.o{color:#fff;border:1px solid rgba(255,255,255,.55)}
.btn:hover{filter:brightness(1.08)}
.tags{background:var(--navy2)}
.tags .in{display:flex;flex-wrap:wrap;gap:8px;padding-block:12px}
.tags span{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#cfe0f7;border:1px solid rgba(156,195,240,.45);border-radius:4px;padding:5px 9px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin:0 0 4px}
h2.sec{font-family:var(--serif);font-weight:800;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.01em;margin:0 0 8px}
.hero span{font-family:var(--serif);font-weight:700}
.hero div.wide{border:1.5px solid var(--coral);background:#fff7f5}
.clave{border-left:3px solid var(--con);border-radius:0 10px 10px 0}
.clave b{font-family:var(--serif);font-size:17px}
.foot{background:var(--navy);color:#c9d3e4;margin-top:40px}
.foot .in{padding-block:24px;font-size:13px;line-height:1.6}
.foot a{color:#fff}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 6px}
.lang button{padding:4px 10px;font-size:12.5px}
td.up{color:var(--up);font-weight:600}td.down{color:var(--down);font-weight:600}td.same{color:var(--ink)}
</style>

k1t:'A small, new core',k1:'Explicit training in public science communication appears in 2020 and reaches 10 programmes in 2026, half of them new that year. All are university diploma courses, nine of them at CRUCH universities. There are no undergraduate or master’s programmes, and nothing at professional institutes or technical training centres.',
k2t:'It arrived after its neighbours',k2:'Museography, science and technology studies, and university outreach (vinculación con el medio) appear earlier and account for most students. Science communication enters the university through these doors, as institutional hinges, before it exists as a field of training in its own right.',
k3t:'Graduate counts correct enrolment',k3:'In 14 of the 24 programmes with graduates, SIES records more graduates than enrolled students. For diploma courses that start after the enrolment cut-off date, graduates are a better sign of real activity. The UC diploma in naturalist illustration, for example, records 26 enrolled students and 63 graduates.',
k4t:'Online and concentrated in Santiago',k4:'In 2026, half of the programmes on offer are online, and the Metropolitan Region hosts more than half of them. Outside it, Valparaíso, Los Ríos, Antofagasta, Biobío and Ñuble stand out.',

n3:'Relevance. Core: public science communication and outreach. Adjacent: science and technology studies, open science, science education for citizenship, museums, university outreach, environmental communication, fact-checking and disinformation, and scientific writing (communication among peers). Peripheral: art and science, knowledge transfer and innovation.',

s6:'Lo que dejan los datos',
k1t:'Un núcleo nuevo y pequeño',k1:'La formación explícita en comunicación pública de la ciencia aparece en 2020 y llega a 10 programas en 2026, la mitad de ellos nuevos ese año. Son todos diplomados universitarios, nueve de universidades del CRUCH. No hay pregrados, magísteres ni oferta de institutos profesionales o CFT.',

k3t:'Los titulados corrigen a la matrícula',k3:'En 14 de los 24 programas con titulados, el SIES registra más titulados que matriculados. En diplomados que inician después de la fecha de corte de la matrícula, los titulados son mejor señal de actividad real. El diplomado de ilustración naturalista de la UC, por ejemplo, registra 26 matriculados y 63 titulados.',
k4t:'Formación a distancia y concentrada en Santiago',k4:'En 2026, la mitad de la oferta vigente es no presencial y la Región Metropolitana reúne más de la mitad de los programas. Fuera de ella destacan Valparaíso, Los Ríos, Antofagasta, Biobío y Ñuble.',
k5t:'Muchos ensayos, pocos que duran',k5:'De los programas surgidos antes de 2026, cerca de la mitad ya se cerró, con una vida mediana de dos años. Sobreviven los que tienen anclaje institucional, como un magíster o un programa de museología con historia. Ningún programa del núcleo se ha cerrado todavía.',

n3:'Relevancia. Núcleo: comunicación pública de la ciencia y divulgación. Conexo: CTS, ciencia abierta, educación científica para la ciudadanía, museos, vinculación con el medio, comunicación ambiental, verificación y desinformación, y escritura científica (comunicación entre pares). Periférico: arte y ciencia, transferencia de conocimiento e innovación.',

let LANG='en';try{const s=localStorage.getItem('cc-lang');if(s==='es'||s==='en')LANG=s;}catch(e){}

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const fmtV=(k,v)=>v==null||isNaN(v)?'—':IND[k].pct?Math.round(v)+' %':IND[k].money?t('money')(v):fmtN(v);

const uniq=a=>[...new Set(a)].filter(Boolean).sort((a,b)=>tv(a).localeCompare(tv(b),LOC()));

function fill(id,vals,allLbl){const s=document.getElementById(id);const cur=s.value;s.replaceChildren(new Option(allLbl,''),...uniq(vals).map(v=>new Option(tv(v),v)));s.value=cur||'';}
function fillSelects(){
  fill('f-cat',P.map(p=>p.c),t('allF'));fill('f-tipo',R.map(r=>r.ti),t('allF'));fill('f-niv',P.map(p=>p.nv),t('all'));fill('f-mod',R.map(r=>r.md).filter(m=>m!=='Sin dato'),t('allF'));
  const si=document.getElementById('f-ind');si.replaceChildren(...Object.keys(IND).map(k=>new Option(indL(k),k)));si.value=S.ind;
  ['cat','tipo','niv','mod'].forEach(k=>document.getElementById('f-'+k).value=S[k]);
}
['f-y0','f-y1'].forEach((id,i)=>{const s=document.getElementById(id);for(let y=Y0;y<=Y1;y++)s.add(new Option(y,y));s.value=i?Y1:Y0;});

function applyI18n(){
  document.documentElement.lang=LANG;document.title=LANG==='en'?'Science communication training in Chile':'Oferta y formación en comunicación de la ciencia en Chile';
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll('[data-vi]').forEach(el=>{el.textContent=tv(el.dataset.vi);});
  document.querySelectorAll('[data-ia]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.ia)));
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  fillSelects();
}

function progOk(p,ignoreRel,rel){const rv=rel===undefined?S.rel:rel;return (ignoreRel||!rv||p.r===rv)&&(!S.cat||p.c===S.cat)&&(!S.niv||p.nv===S.niv);}
function rowOk(r,o={}){const p=P[r.p];return progOk(p,o.ignoreRel,o.rel)&&(!S.tipo||r.ti===S.tipo)&&(!S.mod||r.md===S.mod)&&(o.ignoreReg||!S.reg||r.reg===S.reg)&&(o.ignoreYears||(r.y>=S.y0&&r.y<=S.y1));}
function agg(rows,k){
  if(k==='prog')return new Set(rows.filter(r=>r.of).map(r=>r.p)).size;
  if(k==='fem'){const s=d3.sum(rows,r=>r.mat);return s?d3.sum(rows,r=>r.matM)/s*100:null;}
  if(k==='ftit'){const s=d3.sum(rows,r=>r.tit);return s?d3.sum(rows,r=>r.titM)/s*100:null;}
  if(k==='ara'){const a=rows.filter(r=>r.ara>0).map(r=>r.ara);return a.length?d3.median(a):null;}
  return d3.sum(rows,r=>r[k]);
}
const tipEl=(host)=>{let x=host.querySelector('.tip');if(!x){x=document.createElement('div');x.className='tip';x.hidden=true;host.appendChild(x);}return x;};
function showTip(host,ev,html){const x=tipEl(host);x.innerHTML=html;x.hidden=false;const b=host.getBoundingClientRect();let px=ev.clientX-b.left+12,py=ev.clientY-b.top+12;if(px+x.offsetWidth>b.width)px=Math.max(0,ev.clientX-b.left-x.offsetWidth-12);x.style.left=px+'px';x.style.top=py+'px';}
const hideTip=host=>{const x=host.querySelector('.tip');if(x)x.hidden=true;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderHero(){
  const nuc=R.filter(r=>P[r.p].r==='Núcleo');const all=R;
  const n26=new Set(nuc.filter(r=>r.y===2026&&r.of).map(r=>r.p)).size;
  const a26=new Set(all.filter(r=>r.y===2026&&r.of).map(r=>r.p)).size;
  const first=d3.min(nuc.filter(r=>r.of),r=>r.y);
  const regs=new Set(all.filter(r=>r.y===2026&&r.of).map(r=>r.reg)).size;
  const tN=d3.sum(nuc,r=>r.tit),tA=d3.sum(all,r=>r.tit),mN=d3.sum(nuc,r=>r.mat),mA=d3.sum(all,r=>r.mat);
  const dist=new Set(all.filter(r=>r.y===2026&&r.of&&r.md==='No Presencial').map(r=>r.p)).size;
  const y26=all.filter(r=>r.y===2026),n26r=nuc.filter(r=>r.y===2026);
  const m26=d3.sum(y26,r=>r.mat),w26=d3.sum(y26,r=>r.matM),m26N=d3.sum(n26r,r=>r.mat),w26N=d3.sum(n26r,r=>r.matM);
  const pct=(a,b)=>b?Math.round(a/b*100)+' %':'—';
  document.getElementById('hero').innerHTML=
   `<div class="wide"><em>${t('heroCore')}</em><span>${t('heroCoreV')(n26)}</span><small>${t('heroCoreS')(first)}</small></div>`+
   `<div><em>${t('heroAll')}</em><span>${a26}</span><small>${t('heroAllS')(regs)}</small></div>`+
   `<div><em>${t('heroTit')}</em><span>${fmtN(tA)}</span><small>${t('heroTitS')(fmtN(tN))}</small></div>`+
   `<div><em>${t('heroMat')}</em><span>${fmtN(mA)}</span><small>${t('heroMatS')(fmtN(mN))}</small></div>`+
   `<div><em>${t('heroM26')}</em><span>${fmtN(m26)}</span><small>${t('heroM26S')(fmtN(m26N))}</small></div>`+
   `<div><em>${t('heroW26')}</em><span>${pct(w26,m26)}</span><small>${t('heroW26S')(pct(w26N,m26N))}</small></div>`+
   `<div><em>${t('heroDist')}</em><span>${Math.round(dist/a26*100)} %</span><small>${t('heroDistS')}</small></div>`;
}

function chips(){
  const c=[];if(S.reg)c.push(['reg',t('regionChip')+regN(S.reg)]);if(S.cat)c.push(['cat',tv(S.cat)]);if(S.tipo)c.push(['tipo',tv(S.tipo)]);if(S.niv)c.push(['niv',tv(S.niv)]);if(S.mod)c.push(['mod',tv(S.mod)]);
  const el=document.getElementById('chips');el.replaceChildren(...c.map(([k,txt])=>{const s=document.createElement('span');s.className='chip';s.textContent=txt;const b=document.createElement('button');b.setAttribute('aria-label',t('removeFilter')+' '+txt);b.textContent='×';b.onclick=()=>{S[k]='';const sel=document.getElementById('f-'+k);if(sel)sel.value='';render();};s.appendChild(b);return s;}));
  el.hidden=!c.length;
}

function groupsFor(by){
  if(by==='r')return {key:r=>P[r.p].r,order:['Núcleo','Conexo','Periférico'],color:g=>relColor(g)};
  const key=by==='c'?r=>P[r.p].c:by==='ti'?r=>r.ti:by==='md'?r=>r.md:r=>P[r.p].nv;
  const order=[...new Set(R.filter(r=>rowOk(r,{ignoreYears:true,rel:S.rel1})).map(key))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'es'));
  const pal=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948','#7c7b76','#4fa3a5','#b07aa1','#9c755f'];
  return {key,order,color:g=>pal[order.indexOf(g)%pal.length]};
}
function renderEvo(){
  const host=document.getElementById('evo');const k=S.ind;const G=groupsFor(S.by);
  const rows=R.filter(r=>rowOk(r,{ignoreYears:true,rel:S.rel1}));
  const years=d3.range(Y0,Y1+1);
  const data=years.map(y=>{const ry=rows.filter(r=>r.y===y);const o={y,_tot:agg(ry,k)};G.order.forEach(g=>o[g]=agg(ry.filter(r=>G.key(r)===g),k));return o;});
  document.getElementById('evo-leg').innerHTML=G.order.map(g=>`<span><i style="background:${G.color(g)}"></i>${esc(tv(g))}</span>`).join('');
  const w=Math.max(300,host.clientWidth),h=280,m={t:10,r:10,b:26,l:46};
  const x=d3.scaleBand().domain(years).range([m.l,w-m.r]).padding(.18);
  const ymax=IND[k].add?d3.max(data,d=>d3.sum(G.order,g=>d[g]||0)):d3.max(data,d=>d3.max(G.order,g=>d[g]??0));
  const y=d3.scaleLinear().domain([0,(ymax||1)*1.08]).nice().range([h-m.b,m.t]);
  const svg=d3.create('svg').attr('width','100%').attr('viewBox',`0 0 ${w} ${h}`).attr('role','img').attr('aria-label',t('evoAria')(indL(k)));
  svg.append('g').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(w-m.l-m.r)).tickFormat(v=>IND[k].money?t('moneyAxis')(v):IND[k].pct?v+' %':d3.format('~s')(v))).call(g=>{g.select('.domain').remove();g.selectAll('line').attr('stroke',css('--line'));});
  svg.append('g').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickValues(years.filter(yy=>w<520?yy%3===2:yy%2===0)).tickSize(0)).call(g=>g.select('.domain').attr('stroke',css('--line2')));
  const inR=y0=>y0>=S.y0&&y0<=S.y1;
  if(IND[k].add){
    const st=d3.stack().keys(G.order).value((d,g)=>d[g]||0)(data);
    svg.append('g').selectAll('g').data(st).join('g').attr('fill',s=>G.color(s.key)).selectAll('rect').data(s=>s).join('rect')
      .attr('x',d=>x(d.data.y)).attr('width',x.bandwidth()).attr('y',d=>y(d[1])).attr('height',d=>Math.max(0,y(d[0])-y(d[1])-(d[1]-d[0]>0?1:0))).attr('opacity',d=>inR(d.data.y)?1:.3);
  }else{
    G.order.forEach(g=>{const pts=data.filter(d=>d[g]!=null);svg.append('path').datum(pts).attr('fill','none').attr('stroke',G.color(g)).attr('stroke-width',2).attr('d',d3.line().x(d=>x(d.y)+x.bandwidth()/2).y(d=>y(d[g])));
      svg.append('g').selectAll('circle').data(pts).join('circle').attr('r',3).attr('cx',d=>x(d.y)+x.bandwidth()/2).attr('cy',d=>y(d[g])).attr('fill',G.color(g)).attr('opacity',d=>inR(d.y)?1:.35);});
  }
  svg.append('g').selectAll('rect').data(data).join('rect').attr('x',d=>x(d.y)).attr('width',x.bandwidth()).attr('y',m.t).attr('height',h-m.t-m.b).attr('fill','transparent')
    .on('pointermove',(ev,d)=>showTip(host,ev,`<b>${d.y}</b><br>${esc(indL(k))}: ${fmtV(k,d._tot)}`+G.order.filter(g=>d[g]).map(g=>`<br><span style="color:${G.color(g)}">■</span> ${esc(tv(g))}: ${fmtV(k,d[g])}`).join('')))
    .on('pointerleave',()=>hideTip(host));
  host.replaceChildren(svg.node());
  const tot=agg(R.filter(r=>rowOk(r,{rel:S.rel1})),k);
  document.getElementById('evo-note').textContent=t('evoNote')(indL(k),S.y0,S.y1,fmtV(k,tot))+(k==='tit'?t('titNote'):'')+(k==='mat'||k==='mat1'?t('matNote'):'');
}

let pathGen,features;
function initMap(){
  const fc=topojson.feature(GEO,GEO.objects.regiones);
  features=fc.features.map(f=>{if(d3.geoArea(f)>2*Math.PI){const g=f.geometry;const rv=r=>r.slice().reverse();g.coordinates=g.type==='Polygon'?g.coordinates.map(rv):g.coordinates.map(pp=>pp.map(rv));}return f;});
  const box={type:'Feature',geometry:{type:'Polygon',coordinates:[[[-76,-17.4],[-66.4,-17.4],[-66.4,-56],[-76,-56],[-76,-17.4]]]}};
  pathGen=d3.geoPath(d3.geoMercator().fitExtent([[4,4],[226,616]],box));
}
function renderMap(){
  const host=document.getElementById('map');const k=S.ind;
  const rows=R.filter(r=>rowOk(r,{ignoreReg:true,rel:S.rel2}));
  const val={};REG_ORDER.forEach(c=>{const rr=rows.filter(r=>r.reg===c);val[c]=rr.length?agg(rr,k):null;});
  const vals=Object.values(val).filter(v=>v!=null&&v>0);const mx=d3.max(vals)||1;
  const sq=d3.scaleSqrt().domain([0,mx]).range([0,1]);const ip=d3.interpolateRgb(css('--map0'),css('--map1'));const col=v=>ip(sq(v));
  const svg=d3.create('svg').attr('viewBox','0 0 230 620').attr('width','100%').attr('role','img').attr('aria-label',t('mapAria')(indL(k)));
  svg.append('g').selectAll('path').data(features).join('path').attr('d',pathGen)
    .attr('fill',f=>{const v=val[f.properties.code];return v?col(v):css('--nodata');}).classed('sel',f=>f.properties.code===S.reg)
    .on('pointermove',(ev,f)=>{const c=f.properties.code;showTip(host,ev,`<b>${esc(regN(c))}</b><br>${esc(indL(k))}: ${fmtV(k,val[c])}`);})
    .on('pointerleave',()=>hideTip(host)).on('click',(ev,f)=>{const c=f.properties.code;S.reg=S.reg===c?'':c;render();});
  host.replaceChildren(svg.node());
  const sc=document.createElement('div');sc.className='scale';sc.innerHTML=`<span>${fmtV(k,d3.min(vals)||0)}</span><span class="bar"></span><span>${fmtV(k,mx)}</span>`;host.appendChild(sc);
  const rk=document.getElementById('rank');rk.replaceChildren();
  const list=REG_ORDER.map(c=>[c,val[c]]).sort((a,b)=>(b[1]??-1)-(a[1]??-1));
  list.forEach(([c,v])=>{const b=document.createElement('button');b.textContent=regN(c);b.className=c===S.reg?'on':'';b.onclick=()=>{S.reg=S.reg===c?'':c;render();};
    const tr=document.createElement('div');const i=document.createElement('div');i.className='b';i.style.width=(v&&mx?v/mx*100:0)+'%';i.style.background=v?col(v):'transparent';tr.appendChild(i);
    const vv=document.createElement('div');vv.className='v';vv.textContent=v?fmtV(k,v):'—';rk.append(b,tr,vv);});
  const none=list.filter(x=>!x[1]).length;
  document.getElementById('map-note').textContent=t('mapNote')(16-none,S.y0,S.y1)+(S.reg?t('mapFilt')(regN(S.reg)):'');
}

function bars(title,items,k,colorFn){
  const el=document.createElement('div');el.className='card panel';const h=document.createElement('h3');h.textContent=title;el.appendChild(h);
  if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent=t('noData');el.appendChild(p);return el;}
  const g=document.createElement('div');g.className='hb';const mx=d3.max(items,d=>d[1])||1;
  items.forEach(([l,v,raw])=>{const a=document.createElement('div');a.className='l';a.textContent=l;a.title=l;const tr=document.createElement('div');tr.className='t';const i=document.createElement('i');i.style.width=(v/mx*100)+'%';i.style.background=colorFn?colorFn(raw??l):css('--nuc');tr.appendChild(i);
    const b=document.createElement('div');b.className='v';b.textContent=fmtV(k,v);g.append(a,tr,b);});
  el.appendChild(g);return el;
}
function renderComp(){
  const host=document.getElementById('comp');const k=S.ind;const rows=R.filter(r=>rowOk(r,{rel:S.rel3}));
  const dim=(f,raw)=>{const m=d3.group(rows,f);return [...m].map(([g,rr])=>[raw?g:tv(g||'Sin dato'),agg(rr,k)]).filter(d=>d[1]).sort((a,b)=>b[1]-a[1]);};
  const rr=R.filter(r=>rowOk(r,{ignoreRel:true}));
  const out=[
    bars(t('cRel')+' · '+indL(k),['Núcleo','Conexo','Periférico'].map(g=>[tv(g),agg(rr.filter(r=>P[r.p].r===g),k),g]).filter(d=>d[1]),k,relColor),
    bars(t('cCat'),dim(r=>P[r.p].c),k),bars(t('cTipo'),dim(r=>r.ti),k),bars(t('cInst'),dim(r=>P[r.p].ia,true).slice(0,12),k),
    bars(t('cMod'),dim(r=>r.md),k),bars(t('cNiv'),dim(r=>P[r.p].nv),k),bars(t('cArea'),dim(r=>P[r.p].ar),k),bars(t('cReq'),dim(r=>P[r.p].rq),k)];
  const M=d3.sum(rows,r=>r.matM),H=d3.sum(rows,r=>r.matH),TM=d3.sum(rows,r=>r.titM),TT=d3.sum(rows,r=>r.tit);
  out.push(bars(t('cSex'),[[t('sexMW'),M,'w'],[t('sexMM'),H,'m'],[t('sexTW'),TM,'w'],[t('sexTM'),TT-TM,'m']].filter(d=>d[1]),'mat',x=>css(x==='w'?'--nuc':'--per')));
  const e=[[t('age1'),d3.sum(rows,r=>r.e1)],[t('age2'),d3.sum(rows,r=>r.e2)],[t('age3'),d3.sum(rows,r=>r.e3)]].filter(d=>d[1]);
  const el=bars(t('cAge'),e,'mat');const tm=d3.sum(rows,r=>r.mat);const ea=d3.sum(rows,r=>r.eN);
  if(tm){const p=document.createElement('p');p.className='note';p.textContent=t('ageAvg')((ea/tm).toLocaleString(LOC(),{maximumFractionDigits:1,minimumFractionDigits:1}),fmtN(tm));el.appendChild(p);}
  out.push(el);host.replaceChildren(...out);
}

function progStats(rel){
  const rows=R.filter(r=>rowOk(r,{rel}));const by=d3.group(rows,r=>r.p);
  const byAll=d3.group(R.filter(r=>rowOk(r,{ignoreYears:true,rel})),r=>r.p);
  return [...byAll.keys()].filter(p=>by.has(p)).map(p=>{const pr=P[p],rr=by.get(p),ra=byAll.get(p);const lastAra=ra.filter(r=>r.ara>0).sort((a,b)=>b.y-a.y)[0];
    return {pi:p,ia:pr.ia,n:pr.n,r:pr.r,nv:pr.nv,reg:[...new Set(ra.map(r=>REG[r.reg]?regN(r.reg):tv('Sin dato')))].join(', '),f:pr.f,l:pr.l,act:pr.act,m25:d3.sum(ra.filter(r=>r.y===2025),r=>r.mat),m26:d3.sum(ra.filter(r=>r.y===2026),r=>r.mat),mat:d3.sum(rr,r=>r.mat),tit:d3.sum(rr,r=>r.tit),ara:lastAra?lastAra.ara:null,years:ra};});
}
function renderGantt(){
  const host=document.getElementById('gantt');const st=progStats(S.rel4).sort((a,b)=>a.f-b.f||a.l-b.l||a.ia.localeCompare(b.ia));
  if(!st.length){host.innerHTML=`<p class="empty">${t('noProg')}</p>`;return;}
  const w=Math.max(320,host.clientWidth),lab=w<560?130:260,rowH=20,h=st.length*rowH+30,m={t:4,r:10,b:24,l:lab};
  const x=d3.scaleLinear().domain([Y0-.5,Y1+.5]).range([m.l,w-m.r]);
  const svg=d3.create('svg').attr('width','100%').attr('viewBox',`0 0 ${w} ${h}`).attr('role','img').attr('aria-label',t('ganttAria'));
  svg.append('g').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickValues(d3.range(2008,2027,w<560?4:2)).tickFormat(d3.format('d')).tickSize(-(h-m.b-m.t))).call(g=>{g.select('.domain').remove();g.selectAll('line').attr('stroke',css('--line'));});
  svg.append('rect').attr('x',x(S.y0-.5)).attr('width',x(S.y1+.5)-x(S.y0-.5)).attr('y',m.t).attr('height',h-m.b-m.t).attr('fill',css('--soft')).attr('opacity',.5).lower();
  const g=svg.append('g');
  st.forEach((s,i)=>{const yy=m.t+i*rowH;const c=relColor(s.r);
    const full=`${s.ia} · ${s.n}`;const maxCh=Math.floor(lab/6.2);
    g.append('text').attr('x',m.l-6).attr('y',yy+rowH/2+4).attr('text-anchor','end').text(full.length>maxCh?full.slice(0,maxCh-1)+'…':full);
    const yrs=d3.group(s.years,r=>r.y);
    for(let y=s.f;y<=s.l;y++){const ry=yrs.get(y);const of=ry&&ry.some(r=>r.of);g.append('rect').attr('x',x(y-.5)+.5).attr('width',x(y+.5)-x(y-.5)-1).attr('y',yy+4).attr('height',rowH-8).attr('rx',2).attr('fill',c).attr('opacity',ry?(of?1:.4):.15);}
    g.append('rect').attr('x',m.l).attr('width',w-m.l-m.r).attr('y',yy).attr('height',rowH).attr('fill','transparent')
      .on('pointermove',ev=>showTip(host,ev,`<b>${esc(s.n)}</b><br>${esc(s.ia)} · ${esc(tv(s.r))}<br>${s.f}${s.l>s.f?'–'+s.l:''} · ${s.act?t('ttOn'):t('ttClosed')}<br>${t('ttMat')}: ${fmtN(d3.sum(s.years,r=>r.mat))} · ${t('ttTit')}: ${fmtN(d3.sum(s.years,r=>r.tit))}`))
      .on('pointerleave',()=>hideTip(host));});
  host.replaceChildren(svg.node());
}
function renderTable(){
  const tb=document.querySelector('#tbl tbody');const st=progStats(S.rel5);const {k,d}=S.sort;
  const val=(s,k)=>k==='r'||k==='nv'?tv(s[k]):s[k];
  st.sort((a,b)=>{const A=val(a,k),B=val(b,k);if(A==null)return 1;if(B==null)return -1;return (typeof A==='string'?A.localeCompare(B,LOC()):A-B)*d;});
  document.querySelectorAll('#tbl th').forEach(th=>th.setAttribute('aria-sort',th.dataset.k===k?(d>0?'ascending':'descending'):'none'));
  if(!st.length){tb.innerHTML=`<tr><td colspan="13" class="empty">${t('noProg')}</td></tr>`;return;}
  tb.replaceChildren(...st.map(s=>{const tr=document.createElement('tr');
    const cells=[[s.ia],[s.n],[`<span class="pill p-${RELK[s.r]}">${esc(tv(s.r))}</span>`,1],[tv(s.nv)],[s.reg],[s.f,0,'n'],[s.l,0,'n'],[s.act?`<span class="st-on">${t('onOffer')}</span>`:`<span class="st-off">${t('closed')}</span>`,1],[fmtN(s.m25),0,'n'],[fmtN(s.m26),0,'n '+(s.m26>s.m25?'up':s.m26<s.m25?'down':'same')],[fmtN(s.mat),0,'n'],[fmtN(s.tit),0,'n'],[s.ara?t('moneyFull')(s.ara):'—',0,'n']];
    cells.forEach(([v,html,cl])=>{const td=document.createElement('td');if(cl)td.className=cl;if(html)td.innerHTML=v;else td.textContent=v;tr.appendChild(td);});return tr;}));
}
document.querySelectorAll('#tbl th').forEach(th=>{const go=()=>{S.sort={k:th.dataset.k,d:S.sort.k===th.dataset.k?-S.sort.d:1};renderTable();};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});

function render(){chips();
  [1,2,3,4,5].forEach(i=>document.querySelectorAll('#f-rel-'+i+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S['rel'+i])));
  document.querySelectorAll('#by button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.by));
  renderEvo();renderMap();renderComp();renderGantt();renderTable();}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('cc-lang',LANG);}catch(e){}applyI18n();renderHero();render();});
[1,2,3,4,5].forEach(i=>document.querySelectorAll('#f-rel-'+i+' button').forEach(b=>b.onclick=()=>{S['rel'+i]=b.dataset.v;render();}));
document.querySelectorAll('#by button').forEach(b=>b.onclick=()=>{S.by=b.dataset.v;renderEvo();document.querySelectorAll('#by button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===S.by));});
const bind=(id,key,num)=>document.getElementById(id).onchange=e=>{S[key]=num?+e.target.value:e.target.value;if(S.y0>S.y1){if(key==='y0')S.y1=S.y0;else S.y0=S.y1;document.getElementById('f-y0').value=S.y0;document.getElementById('f-y1').value=S.y1;}render();};
bind('f-ind','ind');bind('f-y0','y0',1);bind('f-y1','y1',1);bind('f-cat','cat');bind('f-tipo','tipo');bind('f-niv','niv');bind('f-mod','mod');
document.getElementById('f-reset').onclick=()=>{Object.assign(S,{rel1:'Núcleo',rel2:'Núcleo',rel3:'Núcleo',rel4:'Núcleo',rel5:'Núcleo',ind:'prog',y0:Y0,y1:Y1,cat:'',tipo:'',niv:'',mod:'',reg:''});fillSelects();document.getElementById('f-y0').value=Y0;document.getElementById('f-y1').value=Y1;render();};
initMap();applyI18n();renderHero();render();
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{renderEvo();renderGantt();},120);}).observe(document.querySelector('.wrap'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
